<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Pessoas</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <h1>Cadastro de Usuário</h1>
    </header>

    <main>
        <div>
            <form>
                <label for="name"><b>Nome:</b></label>
                <input type="text" name="nome" id="nome">

                <label for="sobrenome"><b>Sobrenome:</b></label>
                <input type="text" name="sobrenome" id="sobrenome">

                <label id="emai" for="email"><b>E-mail:</b></label>
                <input type="text" name="e-mail" id="e-mail">

                <label for="sexo"><b>Sexo:</b></label>
                <input type="radio" name="masculino" id="sexo1"> Masculino
                <input type="radio" name="feminino" id="sexo2"> Feminino

                <input type="button" value="Cadastrar" id="botao">
            </form>
        </div>
    </main>

    <footer>
        <p>&copy; Criptografado de ponta a ponta</p>
    </footer>

</body>

</html>
